spring.application.name=backend

# Database (Docker container)
spring.datasource.url=jdbc:postgresql://localhost:5432/lessonrecall
spring.datasource.username=lessonrecall
spring.datasource.password=lessonrecall

# JPA: create/update tables from the entities automatically (fine for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Our Python AI service
ai.service.url=http://127.0.0.1:8000
ai.service.token=${AI_SERVICE_TOKEN:dev-internal-token-change-me-1234567890}
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-at-least-32-chars}
jwt.expiration-hours=24

#uploads up to 25mb .Spring default is Only 1MB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
server.error.include-message=always


