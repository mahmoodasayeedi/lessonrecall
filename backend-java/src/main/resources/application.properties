spring.application.name=backend

# Port: Render sets PORT, locally 8080
server.port=${PORT:8080}

# Database: local Docker by default, Render values in production
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lessonrecall}
spring.datasource.username=${DB_USER:lessonrecall}
spring.datasource.password=${DB_PASSWORD:lessonrecall}

# JPA: create/update tables from the entities automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}

# Our Python AI service
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
ai.service.token=${AI_SERVICE_TOKEN:dev-internal-token-change-me-1234567890}
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-at-least-32-chars}
jwt.expiration-hours=24

# Frontend addresses allowed to call the API (comma-separated)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Uploads up to 25 MB (Spring's default is only 1 MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
server.error.include-message=always

